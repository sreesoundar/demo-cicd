name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/develop'
        with:
          name: ui
          path: dist

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Demo.sln
      - run: dotnet build Demo.sln -c Release --no-restore
      - run: dotnet test Demo.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: api/**/TestResults/*.trx
          if-no-files-found: ignore
      - run: dotnet publish Api/Api.csproj -c Release -r linux-x64 --self-contained -o ../publish-api
        if: github.ref == 'refs/heads/develop'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/develop'
        with:
          name: api
          path: publish-api

  deploy:
    needs: [ci, backend]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    environment: demo-ec2
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: pkg

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # ponytail: trust-on-first-use host key; pin it via an EC2_KNOWN_HOSTS secret for anything beyond the demo
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Ship UI + API, restart, smoke test
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy $TARGET"
          tar -C pkg/ui  -cz . | $SSH 'rm -rf /var/www/demo-ui/*  && tar -C /var/www/demo-ui  -xz'
          tar -C pkg/api -cz . | $SSH 'rm -rf /var/www/demo-api/* && tar -C /var/www/demo-api -xz && chmod +x /var/www/demo-api/Api'
          # upload-artifact drops the exec bit, hence the chmod above
          $SSH 'sudo systemctl restart demo-api'
          # Through Nginx, so this proves the proxy and the API, not just that files landed
          $SSH 'curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://localhost/api/weatherforecast'
          $SSH 'curl -fsS http://localhost/ | grep -q "<div id=\"root\">"'
